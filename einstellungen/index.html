<!DOCTYPE html>
<html lang="de" manifest="../offline.appcache">
<head>
<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1F3A5F">
<title>Einstellungen · Windows Phone 8.1 Web Apps</title>
<link rel="stylesheet" href="../assets/style.css">
<script>var ROOT="../";</script>
<script src="../assets/common.js"></script>
</head>
<body>
<header class="top"><div class="wrap"><a class="iconbtn" href="../" aria-label="Zurück"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></a><h1>Einstellungen</h1><a class="iconbtn" href="../einstellungen/" aria-label="Einstellungen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h8M18 6h2M4 12h2M12 12h8M4 18h10M20 18h0"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/></svg></a></div></header>
<main class="wrap">
<div class="card">
  <h3>Darstellung</h3>
  <div class="seg" id="themeSeg"><button data-v="light">Hell</button><button data-v="dark">Dunkel</button></div>
  <div class="switch" style="margin-top:8px"><span>OLED-Schwarz im Dunkelmodus (reiner schwarzer Hintergrund)</span><button class="tg" id="oled" aria-pressed="false" aria-label="OLED-Schwarz"></button></div>
  <p class="muted" style="font-size:14px;margin:4px 0 0">Die Akzentfarbe stellst du im Werkzeug <a href="../tools/palette/">Farbe &amp; Palette</a> ein.</p>
</div>
<div class="card">
  <h3>Offline</h3>
  <p class="muted" style="font-size:14px;margin:0 0 10px" id="offText"></p>
  <button class="btn tonal" id="offBtn">Nach neuer Version suchen</button>
</div>
<div class="card">
  <h3>Daten</h3>
  <p class="muted" style="font-size:14px;margin:0 0 10px">Einstellungen, Verknüpfungen, Notizen, Aufgaben, Verläufe und Spielstände liegen nur in diesem Browser auf diesem Gerät.</p>
  <button class="btn danger" id="wipe">Alle lokalen Daten löschen</button>
</div>
</main>
<div id="fpsOverlay"></div>
<div class="toast" id="toast" role="status"><span></span></div>
<script>
(function () {
  "use strict";
  function draw() {
    var bs = $$("#themeSeg button"), i;
    for (i = 0; i < bs.length; i++) { bs[i].setAttribute("aria-pressed", bs[i].getAttribute("data-v") === settings.theme ? "true" : "false"); }
    $("#oled").setAttribute("aria-pressed", settings.oled ? "true" : "false");
  }
  draw();
  $("#themeSeg").onclick = function (e) {
    var b = closest(e.target, "button"); if (!b) { return; }
    settings.theme = b.getAttribute("data-v"); saveSettings(); draw();
  };
  $("#oled").onclick = function () { settings.oled = !settings.oled; saveSettings(); draw(); };
  function offDraw(o) {
    var t = {
      none: "Offline-Speicher wird von diesem Browser nicht unterstützt oder ist noch nicht eingerichtet. Öffne die Seite einmal mit Internetverbindung.",
      checking: "Suche nach neuer Version …",
      downloading: "Apps werden für die Offline-Nutzung geladen" + (o.total ? " (" + o.loaded + " von " + o.total + ")" : "") + " …",
      ready: "Alle Apps sind auf diesem Gerät gespeichert und funktionieren auch ohne Internet. Ausnahmen: Netzwerk, Speedtest, Datenvolumen und Social.",
      update: "Neue Version geladen. Sie ist beim nächsten Öffnen einer Seite aktiv.",
      error: "Offline-Speicher konnte nicht aktualisiert werden. Ohne Internet wird die zuletzt gespeicherte Version genutzt.",
      obsolete: "Offline-Speicher wurde vom Server entfernt."
    };
    $("#offText").textContent = t[o.state] || t.none;
    $("#offBtn").style.display = window.applicationCache ? "" : "none";
  }
  offline.sub(offDraw); offDraw(offline);
  $("#offBtn").onclick = function () { if (!offline.update()) { toast("Gerade nicht möglich"); } };
  $("#wipe").onclick = function () {
    if (!confirm("Alle gespeicherten Einstellungen, Verknüpfungen, Notizen, Aufgaben, Verläufe und Spielstände löschen?")) { return; }
    store.wipe(); location.reload();
  };
})();
</script>
</body>
</html>
