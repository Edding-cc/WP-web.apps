<!DOCTYPE html>
<html lang="de" manifest="../../offline.appcache">
<head>
<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1F3A5F">
<title>Mauerbrecher · Windows Phone 8.1 Web Apps</title>
<link rel="stylesheet" href="../../assets/style.css">
<style>
#cv { display: block; border-radius: 12px; -ms-touch-action: none; touch-action: none; }
</style>
<script>var ROOT="../../";</script>
<script src="../../assets/common.js"></script>
</head>
<body>
<header class="top"><div class="wrap"><a class="iconbtn" href="../../" aria-label="Zurück"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></a><h1>Mauerbrecher</h1><a class="iconbtn" href="../../einstellungen/" aria-label="Einstellungen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h8M18 6h2M4 12h2M12 12h8M4 18h10M20 18h0"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/></svg></a></div></header>
<main class="wrap">
<div class="stats"><div><b id="bScore">0</b><span>Punkte</span></div><div><b id="bLevel">1</b><span>Level</span></div><div><b id="bLives">3</b><span>Leben</span></div><div><b id="bBest">0</b><span>Rekord</span></div></div>
<div class="board" id="bBoard"><canvas id="cv"></canvas></div>
<div class="ctl"><button data-d="-1" aria-label="Links">←</button><button id="bGo" class="ac">Start</button><button data-d="1" aria-label="Rechts">→</button></div>
<p class="muted" style="font-size:14px">Schiebe den Schläger mit dem Finger über das Spielfeld oder halte die Pfeiltasten. Tippe aufs Feld, um den Ball abzuschießen. Wo der Ball den Schläger trifft, bestimmt seinen Winkel.</p>
</main>
<div id="fpsOverlay"></div>
<div class="toast" id="toast" role="status"><span></span></div>
<script>
(function () {
  "use strict";
  /* Spielwelt in festen Einheiten 320 × 440, skaliert auf die Bildschirmbreite */
  var WW = 320, WH = 440, PW = 58, PH = 9, PY = WH - 30, BR = 5, COLS = 8, BW = 34.5, BH = 13, GAP = 4, TOP = 46;
  var ROWC = ["#e0483e", "#ee7a22", "#e8b81a", "#43b047", "#29a0c6", "#3a6fe0", "#8e5bd1", "#d14f9c"];
  var cv = $("#cv"), ctx = cv.getContext("2d"), sc = 1;
  var raf = window.requestAnimationFrame || window.msRequestAnimationFrame || function (f) { return setTimeout(function () { f(+new Date()); }, 16); };
  var best = store.get("brk.best", 0);
  var px, ball, bricks, score, level, lives, state, last = 0, keyDir = 0, holdDir = 0, loopOn = false, msg = "";

  function speed() { return 230 + (level - 1) * 28; }
  function build() {
    var rows = Math.min(4 + level, 8), r, c;
    bricks = [];
    for (r = 0; r < rows; r++) { for (c = 0; c < COLS; c++) {
      bricks.push({ x: 8 + c * (BW + GAP), y: TOP + r * (BH + GAP), r: r, hp: level >= 3 && r < Math.min(level - 2, 3) ? 2 : 1 });
    } }
  }
  function stick() { ball = { x: px, y: PY - BR - 1, vx: 0, vy: 0, stuck: true }; }
  function newGame() { score = 0; level = 1; lives = 3; px = WW / 2; build(); stick(); state = "ready"; msg = "Tippe zum Abschießen"; hud(); draw(); }
  function hud() {
    $("#bScore").textContent = score; $("#bLevel").textContent = level; $("#bLives").textContent = lives; $("#bBest").textContent = best;
    $("#bGo").textContent = state === "run" ? "Pause" : state === "over" ? "Neu" : state === "pause" ? "Weiter" : "Start";
  }
  function launch() {
    if (state === "over") { newGame(); return; }
    if (ball.stuck) { var a = (rnd(41) - 20) * Math.PI / 180, s = speed(); ball.vx = s * Math.sin(a); ball.vy = -s * Math.cos(a); ball.stuck = false; }
    state = "run"; msg = ""; hud(); loop();
  }
  function pause() { if (state === "run") { state = "pause"; msg = "Pause"; hud(); draw(); } }
  function loop() { if (!loopOn) { loopOn = true; last = 0; raf(frame); } }
  function frame(t) {
    if (state !== "run") { loopOn = false; draw(); return; }
    var dt = last ? Math.min(0.033, (t - last) / 1000) : 0.016, n, k;
    last = t;
    var dir = keyDir || holdDir;
    if (dir) { px += dir * 380 * dt; }
    px = Math.max(PW / 2, Math.min(WW - PW / 2, px));
    if (ball.stuck) { ball.x = px; }
    else {
      n = Math.ceil(Math.max(Math.abs(ball.vx), Math.abs(ball.vy)) * dt / 3);
      for (k = 0; k < n && state === "run"; k++) { step(dt / n); }
    }
    draw(); raf(frame);
  }
  function step(dt) {
    var ox = ball.x, oy = ball.y, i, br, hit = null, rel, a, s;
    ball.x += ball.vx * dt; ball.y += ball.vy * dt;
    if (ball.x < BR) { ball.x = BR; ball.vx = Math.abs(ball.vx); }
    if (ball.x > WW - BR) { ball.x = WW - BR; ball.vx = -Math.abs(ball.vx); }
    if (ball.y < BR) { ball.y = BR; ball.vy = Math.abs(ball.vy); }
    /* Schläger: Trefferpunkt bestimmt den Winkel (bis 60° aus der Senkrechten) */
    if (ball.vy > 0 && ball.y + BR >= PY && oy + BR <= PY + 2 && ball.x >= px - PW / 2 - BR && ball.x <= px + PW / 2 + BR) {
      rel = Math.max(-1, Math.min(1, (ball.x - px) / (PW / 2)));
      a = rel * Math.PI / 3; s = speed();
      ball.vx = s * Math.sin(a); ball.vy = -s * Math.cos(a); ball.y = PY - BR;
    }
    if (ball.y > WH + BR * 2) { lose(); return; }
    for (i = 0; i < bricks.length; i++) {
      br = bricks[i];
      if (ball.x + BR > br.x && ball.x - BR < br.x + BW && ball.y + BR > br.y && ball.y - BR < br.y + BH) { hit = br; break; }
    }
    if (hit) {
      /* kam der Ball von der Seite, horizontal abprallen, sonst vertikal */
      if (ox + BR <= hit.x || ox - BR >= hit.x + BW) { ball.vx = -ball.vx; ball.x = ox; } else { ball.vy = -ball.vy; ball.y = oy; }
      hit.hp--;
      if (hit.hp <= 0) { bricks.splice(i, 1); score += (8 - hit.r) * 10 * level; }
      else { score += 5; }
      if (score > best) { best = score; store.set("brk.best", best); }
      hud();
      if (!bricks.length) { level++; build(); stick(); state = "ready"; msg = "Level " + level + " – tippe zum Abschießen"; hud(); }
    }
  }
  function lose() {
    lives--;
    if (lives <= 0) { state = "over"; msg = "Spiel vorbei – " + score + " Punkte"; }
    else { stick(); state = "ready"; msg = "Noch " + lives + " Leben – tippe zum Abschießen"; }
    hud();
  }
  function roundRect(x, y, w, h, r) {
    ctx.beginPath(); ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y); ctx.arcTo(x + w, y, x + w, y + r, r); ctx.lineTo(x + w, y + h - r);
    ctx.arcTo(x + w, y + h, x + w - r, y + h, r); ctx.lineTo(x + r, y + h); ctx.arcTo(x, y + h, x, y + h - r, r); ctx.lineTo(x, y + r); ctx.arcTo(x, y, x + r, y, r); ctx.fill();
  }
  function draw() {
    var t = getTheme(), i, br;
    ctx.fillStyle = t.sf2; ctx.fillRect(0, 0, WW, WH);
    for (i = 0; i < bricks.length; i++) {
      br = bricks[i];
      ctx.fillStyle = br.hp > 1 ? mix(ROWC[br.r % 8], "#000000", 0.6) : ROWC[br.r % 8];
      roundRect(br.x, br.y, BW, BH, 3);
    }
    ctx.fillStyle = t.ac; roundRect(px - PW / 2, PY, PW, PH, 4);
    ctx.fillStyle = t.tx; ctx.beginPath(); ctx.arc(ball.x, ball.y, BR, 0, Math.PI * 2); ctx.fill();
    if (msg) {
      ctx.fillStyle = t.dark ? "rgba(0,0,0,.55)" : "rgba(255,255,255,.75)"; ctx.fillRect(0, WH / 2 - 26, WW, 44);
      ctx.fillStyle = t.tx; ctx.font = "600 16px 'Segoe WP','Segoe UI',Roboto,Arial,sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillText(msg, WW / 2, WH / 2 - 4);
    }
  }
  function size() {
    var W = Math.min(contentWidth(), 420), r = window.devicePixelRatio || 1;
    sc = W / WW;
    cv.style.width = W + "px"; cv.style.height = Math.round(WH * sc) + "px"; $("#bBoard").style.width = W + "px";
    cv.width = Math.round(W * r); cv.height = Math.round(WH * sc * r);
    ctx.setTransform(sc * r, 0, 0, sc * r, 0, 0);
    draw();
  }
  /* Finger oder Maus über dem Spielfeld bewegt den Schläger */
  function setPaddle(x) { px = Math.max(PW / 2, Math.min(WW - PW / 2, x)); if (ball.stuck) { ball.x = px; } if (state !== "run") { draw(); } }
  function moveTo(clientX) { setPaddle((clientX - cv.getBoundingClientRect().left) / sc); }
  var downX = 0, moved = false;
  function down(x) { downX = x; moved = false; }
  function move(x) { if (Math.abs(x - downX) > 6) { moved = true; } moveTo(x); }
  function up() { if (!moved && state !== "run") { launch(); } }
  if (window.PointerEvent || window.MSPointerEvent) {
    var P = window.PointerEvent ? ["pointerdown", "pointermove", "pointerup"] : ["MSPointerDown", "MSPointerMove", "MSPointerUp"];
    cv.addEventListener(P[0], function (e) { e.preventDefault(); down(e.clientX); moveTo(e.clientX); }, false);
    cv.addEventListener(P[1], function (e) { move(e.clientX); }, false);
    cv.addEventListener(P[2], function () { up(); }, false);
  } else {
    cv.addEventListener("touchstart", function (e) { e.preventDefault(); down(e.touches[0].clientX); moveTo(e.touches[0].clientX); }, false);
    cv.addEventListener("touchmove", function (e) { e.preventDefault(); move(e.touches[0].clientX); }, false);
    cv.addEventListener("touchend", function () { up(); }, false);
    cv.addEventListener("mousemove", function (e) { moveTo(e.clientX); }, false);
    cv.addEventListener("mouseup", function () { up(); }, false);
  }
  var bs = $$(".ctl button[data-d]"), i;
  for (i = 0; i < bs.length; i++) {
    (function (b) {
      onPress(b, function () { holdDir = parseInt(b.getAttribute("data-d"), 10); if (state !== "run") { setPaddle(px + holdDir * 12); } });
    })(bs[i]);
  }
  function release() { holdDir = 0; }
  document.addEventListener(window.PointerEvent ? "pointerup" : window.MSPointerEvent ? "MSPointerUp" : "mouseup", release, false);
  document.addEventListener("touchend", release, false);
  onPress($("#bGo"), function () { if (state === "run") { pause(); } else { launch(); } });
  document.addEventListener("keydown", function (e) {
    if (e.keyCode === 37 || e.keyCode === 65) { keyDir = -1; e.preventDefault(); }
    else if (e.keyCode === 39 || e.keyCode === 68) { keyDir = 1; e.preventDefault(); }
    else if (e.keyCode === 32 || e.keyCode === 38) { e.preventDefault(); if (state === "run") { pause(); } else { launch(); } }
  }, false);
  document.addEventListener("keyup", function (e) { if (e.keyCode === 37 || e.keyCode === 65 || e.keyCode === 39 || e.keyCode === 68) { keyDir = 0; } }, false);
  document.addEventListener("visibilitychange", function () { if (document.hidden) { pause(); } }, false);
  document.addEventListener("msvisibilitychange", function () { if (document.msHidden) { pause(); } }, false);
  window.onblur = pause;
  window.onresize = size;
  newGame(); size();
})();
</script>
</body>
</html>
