<!DOCTYPE html>
<html lang="de" manifest="../../offline.appcache">
<head>
<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1F3A5F">
<title>Tetris · Windows Phone 8.1 Web Apps</title>
<link rel="stylesheet" href="../../assets/style.css">
<style>
#tWrap { display: -ms-flexbox; display: flex; -ms-flex-pack: center; justify-content: center; -ms-flex-align: start; align-items: flex-start; margin-bottom: 10px; }
#tc { display: block; border-radius: 8px; -ms-touch-action: none; touch-action: none; }
#tSide { margin-left: 12px; width: 92px; font-size: 13px; }
#tSide b { display: block; font-size: 20px; line-height: 1.2; margin-bottom: 6px; }
#tn { display: block; border-radius: 8px; margin-bottom: 8px; }
</style>
<script>var ROOT="../../";</script>
<script src="../../assets/common.js"></script>
</head>
<body>
<header class="top"><div class="wrap"><a class="iconbtn" href="../../" aria-label="Zurück"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></a><h1>Tetris</h1><a class="iconbtn" href="../../einstellungen/" aria-label="Einstellungen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h8M18 6h2M4 12h2M12 12h8M4 18h10M20 18h0"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/></svg></a></div></header>
<main class="wrap">
<div id="tWrap"><canvas id="tc"></canvas>
<div id="tSide"><span class="muted">Nächster</span><canvas id="tn"></canvas>
<span class="muted">Punkte</span><b id="tScore">0</b><span class="muted">Reihen</span><b id="tLines">0</b><span class="muted">Level</span><b id="tLevel">1</b><span class="muted">Rekord</span><b id="tBest">0</b></div></div>
<div class="ctl c4" id="tPad"><button data-a="left" aria-label="Links">←</button><button data-a="right" aria-label="Rechts">→</button><button data-a="down" aria-label="Schneller">↓</button><button data-a="rot" class="tonal" aria-label="Drehen">↻</button></div>
<div class="ctl c2"><button id="tStart" class="ac">Start</button><button data-a="drop" id="tDrop" class="tonal">Fallen lassen</button></div>
<p class="muted help" style="font-size:14px">Halte ← → ↓ gedrückt für schnelle Bewegung. Antippen des Spielfelds dreht ebenfalls. Tastatur: Pfeile, Leertaste fällt, P pausiert.</p>
</main>
<div id="fpsOverlay"></div>
<div class="toast" id="toast" role="status"><span></span></div>
<script>
(function () {
  "use strict";
  var W = 10, H = 20;
  var SHAPES = {
    I: [[0, 1], [1, 1], [2, 1], [3, 1]], O: [[1, 0], [2, 0], [1, 1], [2, 1]], T: [[1, 0], [0, 1], [1, 1], [2, 1]],
    S: [[1, 0], [2, 0], [0, 1], [1, 1]], Z: [[0, 0], [1, 0], [1, 1], [2, 1]], J: [[0, 0], [0, 1], [1, 1], [2, 1]], L: [[2, 0], [0, 1], [1, 1], [2, 1]]
  };
  var COL = { I: "#29b6d6", O: "#e8c22a", T: "#9c5bd1", S: "#43b047", Z: "#e0483e", J: "#3a6fe0", L: "#ee8a22" };
  var cv = $("#tc"), ctx = cv.getContext("2d"), nv = $("#tn"), nctx = nv.getContext("2d"), cs = 16;
  var grid, cur, next, bag = [], score, lines, level, running = false, over = true, timer = 0, best = store.get("tetris.best", 0);

  function newBag() { bag = shuffle(["I", "O", "T", "S", "Z", "J", "L"]); }
  function take() { if (!bag.length) { newBag(); } return bag.pop(); }
  function piece(k) {
    var c = [], i, sz = k === "I" || k === "O" ? 4 : 3;
    for (i = 0; i < 4; i++) { c.push([SHAPES[k][i][0], SHAPES[k][i][1]]); }
    return { k: k, c: c, x: k === "O" ? 3 : 3, y: k === "I" ? -1 : 0, sz: sz };
  }
  function cells(p) { var o = [], i; for (i = 0; i < 4; i++) { o.push([p.x + p.c[i][0], p.y + p.c[i][1]]); } return o; }
  function fits(p) {
    var a = cells(p), i, x, y;
    for (i = 0; i < 4; i++) {
      x = a[i][0]; y = a[i][1];
      if (x < 0 || x >= W || y >= H) { return false; }
      if (y >= 0 && grid[y][x]) { return false; }
    }
    return true;
  }
  function rotate() {
    if (cur.k === "O") { return; }
    var p = { k: cur.k, x: cur.x, y: cur.y, sz: cur.sz, c: [] }, i, kicks = [0, -1, 1, -2, 2];
    for (i = 0; i < 4; i++) { p.c.push([cur.sz - 1 - cur.c[i][1], cur.c[i][0]]); }
    for (i = 0; i < kicks.length; i++) { p.x = cur.x + kicks[i]; if (fits(p)) { cur = p; draw(); return; } }
  }
  function shift(dx, dy) {
    var p = { k: cur.k, c: cur.c, x: cur.x + dx, y: cur.y + dy, sz: cur.sz };
    if (fits(p)) { cur = p; return true; }
    return false;
  }
  function lock() {
    var a = cells(cur), i, y, full = 0;
    for (i = 0; i < 4; i++) {
      if (a[i][1] < 0) { return gameOver(); }
      grid[a[i][1]][a[i][0]] = cur.k;
    }
    for (y = H - 1; y >= 0; y--) {
      var row = grid[y], f = true;
      for (i = 0; i < W; i++) { if (!row[i]) { f = false; break; } }
      if (f) { grid.splice(y, 1); grid.unshift(emptyRow()); full++; y++; }
    }
    if (full) {
      score += [0, 100, 300, 500, 800][full] * level; lines += full;
      level = Math.floor(lines / 10) + 1;
    }
    spawn();
  }
  function spawn() {
    cur = piece(next); next = take();
    if (!fits(cur)) { return gameOver(); }
    stats(); draw(); drawNext();
  }
  function emptyRow() { var r = [], i; for (i = 0; i < W; i++) { r.push(""); } return r; }
  function gravity() { return Math.max(70, 800 - (level - 1) * 70); }
  function tick() {
    if (!running) { return; }
    if (!shift(0, 1)) { lock(); }
    draw();
    if (running) { timer = setTimeout(tick, gravity()); }
  }
  function act(a) {
    if (!running) { if (a === "rot" || a === "drop") { if (over) { newGame(); } else { resume(); } } return; }
    if (a === "left") { shift(-1, 0); }
    else if (a === "right") { shift(1, 0); }
    else if (a === "down") { if (shift(0, 1)) { score += 1; } else { lock(); } }
    else if (a === "rot") { rotate(); }
    else if (a === "drop") { var n = 0; while (shift(0, 1)) { n++; } score += n * 2; lock(); }
    stats(); draw();
  }
  function stats() {
    if (score > best) { best = score; store.set("tetris.best", best); }
    $("#tScore").textContent = score; $("#tLines").textContent = lines; $("#tLevel").textContent = level; $("#tBest").textContent = best;
  }
  function newGame() {
    var y; grid = []; for (y = 0; y < H; y++) { grid.push(emptyRow()); }
    score = 0; lines = 0; level = 1; over = false; newBag(); next = take();
    spawn(); resume();
  }
  function resume() {
    if (over || running) { return; }
    running = true; $("#tStart").textContent = "Pause";
    clearTimeout(timer); timer = setTimeout(tick, gravity()); draw();
  }
  function pause() {
    if (!running) { return; }
    running = false; clearTimeout(timer); $("#tStart").textContent = "Weiter"; draw();
  }
  function gameOver() {
    running = false; over = true; clearTimeout(timer); stats(); draw();
    $("#tStart").textContent = "Neues Spiel";
  }
  function block(c, x, y, s, col, alpha) {
    c.globalAlpha = alpha || 1; c.fillStyle = col; c.fillRect(x * s + 1, y * s + 1, s - 2, s - 2); c.globalAlpha = 1;
  }
  function draw() {
    var t = getTheme(), x, y, i, a;
    ctx.fillStyle = t.sf2; ctx.fillRect(0, 0, W * cs, H * cs);
    ctx.strokeStyle = t.bd; ctx.lineWidth = 1;
    for (x = 1; x < W; x++) { ctx.beginPath(); ctx.moveTo(x * cs + 0.5, 0); ctx.lineTo(x * cs + 0.5, H * cs); ctx.stroke(); }
    if (!grid) { return; }
    for (y = 0; y < H; y++) { for (x = 0; x < W; x++) { if (grid[y][x]) { block(ctx, x, y, cs, COL[grid[y][x]]); } } }
    if (cur && !over) {
      var g = { k: cur.k, c: cur.c, x: cur.x, y: cur.y, sz: cur.sz };
      while (fits({ k: g.k, c: g.c, x: g.x, y: g.y + 1, sz: g.sz })) { g.y++; }
      a = cells(g); for (i = 0; i < 4; i++) { if (a[i][1] >= 0) { block(ctx, a[i][0], a[i][1], cs, COL[cur.k], 0.25); } }
      a = cells(cur); for (i = 0; i < 4; i++) { if (a[i][1] >= 0) { block(ctx, a[i][0], a[i][1], cs, COL[cur.k]); } }
    }
    if (!running) {
      ctx.fillStyle = t.dark ? "rgba(0,0,0,.55)" : "rgba(255,255,255,.7)"; ctx.fillRect(0, 0, W * cs, H * cs);
      ctx.fillStyle = t.tx; ctx.font = "bold " + Math.round(cs * 1.1) + "px Segoe WP, Segoe UI, Arial"; ctx.textAlign = "center";
      ctx.fillText(over ? (score ? "Spiel vorbei" : "Tetris") : "Pause", W * cs / 2, H * cs / 2 - cs);
      ctx.font = Math.round(cs * 0.8) + "px Segoe WP, Segoe UI, Arial";
      ctx.fillText(over ? "Start antippen" : "Weiter antippen", W * cs / 2, H * cs / 2 + cs * 0.6);
    }
  }
  function drawNext() {
    var t = getTheme(), s = 18, c = SHAPES[next], i, mnx = 9, mxx = 0, mny = 9, mxy = 0, ox, oy;
    nctx.fillStyle = t.sf2; nctx.fillRect(0, 0, 92, 60);
    for (i = 0; i < 4; i++) { mnx = Math.min(mnx, c[i][0]); mxx = Math.max(mxx, c[i][0]); mny = Math.min(mny, c[i][1]); mxy = Math.max(mxy, c[i][1]); }
    ox = (92 - (mxx - mnx + 1) * s) / 2; oy = (60 - (mxy - mny + 1) * s) / 2;
    nctx.fillStyle = COL[next];
    for (i = 0; i < 4; i++) { nctx.fillRect(ox + (c[i][0] - mnx) * s + 1, oy + (c[i][1] - mny) * s + 1, s - 2, s - 2); }
  }
  function size() {
    var r = window.devicePixelRatio || 1, availW = $("#tWrap").clientWidth - 104, availH = isFs() ? availHeight($("#tWrap")) : (window.innerHeight || 600) - 250;
    cs = Math.max(12, Math.min(30, Math.floor(Math.min(availW / W, availH / H))));
    cv.style.width = W * cs + "px"; cv.style.height = H * cs + "px";
    cv.width = Math.round(W * cs * r); cv.height = Math.round(H * cs * r); ctx.setTransform(r, 0, 0, r, 0, 0);
    nv.style.width = "92px"; nv.style.height = "60px"; nv.width = Math.round(92 * r); nv.height = Math.round(60 * r); nctx.setTransform(r, 0, 0, r, 0, 0);
    draw(); if (next) { drawNext(); }
  }

  var bs = $$("#tPad button, #tDrop");
  for (var i = 0; i < bs.length; i++) {
    (function (b) {
      var a = b.getAttribute("data-a");
      onPress(b, function () { act(a); }, a === "left" || a === "right" ? 90 : a === "down" ? 50 : 0);
    })(bs[i]);
  }
  onPress($("#tStart"), function () { if (over) { newGame(); } else if (running) { pause(); } else { resume(); } });
  onPress(cv, function () { act("rot"); });
  document.addEventListener("keydown", function (e) {
    var k = e.keyCode, m = { 37: "left", 39: "right", 40: "down", 38: "rot", 32: "drop" };
    if (m[k]) { e.preventDefault(); act(m[k]); }
    else if (k === 80) { if (running) { pause(); } else { resume(); } }
  }, false);
  document.addEventListener("visibilitychange", function () { if (document.hidden) { pause(); } }, false);
  document.addEventListener("msvisibilitychange", function () { if (document.msHidden) { pause(); } }, false);
  window.onblur = pause;
  window.onresize = size;
  $("#tBest").textContent = best;
  size();
})();
</script>
</body>
</html>
