<!DOCTYPE html>
<html lang="de" manifest="../../offline.appcache">
<head>
<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1F3A5F">
<title>Flattervogel · Windows Phone 8.1 Web Apps</title>
<link rel="stylesheet" href="../../assets/style.css">
<style>
#cv { display: block; border-radius: 12px; cursor: pointer; }
</style>
<script>var ROOT="../../";</script>
<script src="../../assets/common.js"></script>
</head>
<body>
<header class="top"><div class="wrap"><a class="iconbtn" href="../../" aria-label="Zurück"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></a><h1>Flattervogel</h1><a class="iconbtn" href="../../einstellungen/" aria-label="Einstellungen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h8M18 6h2M4 12h2M12 12h8M4 18h10M20 18h0"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/></svg></a></div></header>
<main class="wrap">
<div class="chips" id="fMode"><button data-m="0">Entspannt</button><button data-m="1">Normal</button></div>
<div class="stats"><div><b id="fScore">0</b><span>Punkte</span></div><div><b id="fBest">0</b><span>Rekord</span></div></div>
<div class="board" id="fBoard"><canvas id="cv"></canvas></div>
<p class="muted" style="font-size:14px">Tippe aufs Spielfeld (oder Leertaste), damit der Vogel nach oben flattert. Fliege durch die Lücken zwischen den Säulen. „Entspannt“ hat größere Lücken und ist langsamer.</p>
</main>
<div id="fpsOverlay"></div>
<div class="toast" id="toast" role="status"><span></span></div>
<script>
(function () {
  "use strict";
  /* Spielwelt 320 × 460 Einheiten, feste Schrittweite für gleiches Verhalten auf langsamen Geräten */
  var WW = 320, WH = 460, GROUND = 50, BX = 86, BR = 11, PIPEW = 54, STEP = 1 / 120;
  var MODES = [{ gap: 150, speed: 115, grav: 1250, flap: -380, space: 200 }, { gap: 128, speed: 140, grav: 1450, flap: -420, space: 180 }];
  var cv = $("#cv"), ctx = cv.getContext("2d"), sc = 1;
  var raf = window.requestAnimationFrame || window.msRequestAnimationFrame || function (f) { return setTimeout(function () { f(+new Date()); }, 16); };
  var mode = store.get("flap.mode", 0), best = store.get("flap.best", [0, 0]);
  var by, vy, pipes, score, state, acc = 0, last = 0, tAll = 0, deadAt = 0, loopOn = false;

  function M() { return MODES[mode]; }
  function reset() { by = WH / 2 - 40; vy = 0; pipes = []; score = 0; state = "ready"; tAll = 0; hud(); }
  function hud() {
    $("#fScore").textContent = score; $("#fBest").textContent = best[mode];
    var bs = $$("#fMode button"), i;
    for (i = 0; i < bs.length; i++) { bs[i].setAttribute("aria-pressed", +bs[i].getAttribute("data-m") === mode ? "true" : "false"); }
  }
  function addPipe(x) {
    var m = M(), min = 70 + m.gap / 2, max = WH - GROUND - 50 - m.gap / 2;
    pipes.push({ x: x, cy: min + rnd(Math.max(1, Math.round(max - min))), done: false });
  }
  function flap() {
    if (state === "dead") { if (+new Date() - deadAt > 600) { reset(); draw(); } return; }
    if (state === "ready") { state = "run"; addPipe(WW + 40); loop(); }
    vy = M().flap;
  }
  function loop() { if (!loopOn) { loopOn = true; last = 0; acc = 0; raf(frame); } }
  function frame(t) {
    var dt = last ? Math.min(0.1, (t - last) / 1000) : STEP;
    last = t; acc += dt;
    while (acc >= STEP && state === "run") { update(STEP); acc -= STEP; }
    draw();
    if (state === "run") { raf(frame); } else { loopOn = false; }
  }
  function hitRect(x, y, w, h) {
    var nx = Math.max(x, Math.min(BX, x + w)), ny = Math.max(y, Math.min(by, y + h));
    return (BX - nx) * (BX - nx) + (by - ny) * (by - ny) < BR * BR;
  }
  function update(dt) {
    var m = M(), i, p, lastP;
    tAll += dt;
    vy += m.grav * dt; by += vy * dt;
    if (by < BR) { by = BR; vy = 0; }
    for (i = 0; i < pipes.length; i++) {
      p = pipes[i]; p.x -= m.speed * dt;
      if (!p.done && p.x + PIPEW < BX - BR) { p.done = true; score++; hud(); }
      /* Kreis gegen Säulen und ihre etwas breiteren Köpfe */
      var gt = p.cy - m.gap / 2, gb = p.cy + m.gap / 2;
      if (hitRect(p.x, -50, PIPEW, gt + 50) || hitRect(p.x - 3, gt - 14, PIPEW + 6, 14) || hitRect(p.x, gb, PIPEW, WH) || hitRect(p.x - 3, gb, PIPEW + 6, 14)) { die(); return; }
    }
    if (pipes.length && pipes[0].x + PIPEW < -10) { pipes.shift(); }
    lastP = pipes[pipes.length - 1];
    if (!lastP || lastP.x < WW - m.space) { addPipe(WW + 10); }
    if (by + BR >= WH - GROUND) { by = WH - GROUND - BR; die(); }
  }
  function die() {
    state = "dead"; deadAt = +new Date();
    if (score > best[mode]) { best[mode] = score; store.set("flap.best", best); toast("Neuer Rekord!"); }
    hud();
  }
  function draw() {
    var t = getTheme(), m = M(), i, p, off = (tAll * m.speed) % 24, ang;
    ctx.fillStyle = t.dark ? "#16324a" : "#bfe3f5"; ctx.fillRect(0, 0, WW, WH);
    for (i = 0; i < pipes.length; i++) {
      p = pipes[i];
      ctx.fillStyle = "#3f9a3f";
      ctx.fillRect(p.x, 0, PIPEW, p.cy - m.gap / 2);
      ctx.fillRect(p.x, p.cy + m.gap / 2, PIPEW, WH - GROUND - p.cy - m.gap / 2);
      ctx.fillStyle = "#2f7a2f";
      ctx.fillRect(p.x - 3, p.cy - m.gap / 2 - 14, PIPEW + 6, 14);
      ctx.fillRect(p.x - 3, p.cy + m.gap / 2, PIPEW + 6, 14);
    }
    ctx.fillStyle = "#c9a35a"; ctx.fillRect(0, WH - GROUND, WW, GROUND);
    ctx.fillStyle = "#7cb342"; ctx.fillRect(0, WH - GROUND, WW, 8);
    ctx.fillStyle = "#b08a45";
    for (i = -1; i < WW / 24 + 1; i++) { ctx.fillRect(i * 24 - off, WH - GROUND + 18, 12, 4); }
    var y = state === "ready" ? by + Math.sin(+new Date() / 200) * 4 : by;
    ang = state === "ready" ? 0 : Math.max(-0.5, Math.min(1.2, vy / 600));
    ctx.save(); ctx.translate(BX, y); ctx.rotate(ang);
    ctx.fillStyle = "#f4c430"; ctx.beginPath(); ctx.arc(0, 0, BR, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#e0a020"; ctx.beginPath(); ctx.arc(-3, 3, 5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#ffffff"; ctx.beginPath(); ctx.arc(4, -4, 4, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#111111"; ctx.beginPath(); ctx.arc(5, -4, 2, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#ee7a22"; ctx.beginPath(); ctx.moveTo(9, 0); ctx.lineTo(17, 3); ctx.lineTo(9, 6); ctx.fill();
    ctx.restore();
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    if (state === "run" || state === "dead") {
      ctx.font = "700 40px 'Segoe WP','Segoe UI',Roboto,Arial,sans-serif";
      ctx.fillStyle = "rgba(0,0,0,.35)"; ctx.fillText(score, WW / 2 + 2, 62);
      ctx.fillStyle = "#ffffff"; ctx.fillText(score, WW / 2, 60);
    }
    if (state !== "run") {
      ctx.fillStyle = "rgba(0,0,0,.45)"; ctx.fillRect(0, WH / 2 + 30, WW, 46);
      ctx.fillStyle = "#ffffff"; ctx.font = "600 17px 'Segoe WP','Segoe UI',Roboto,Arial,sans-serif";
      ctx.fillText(state === "ready" ? "Tippe zum Losfliegen" : "Vorbei! Tippe für eine neue Runde", WW / 2, WH / 2 + 53);
    }
  }
  /* Bereit-Zustand: sanftes Schweben ohne Dauer-Schleife, wenn die Seite verdeckt ist */
  function idle() { if (state === "ready" && !document.hidden && !document.msHidden) { draw(); } setTimeout(idle, 50); }
  function size() {
    var W = Math.min(contentWidth(), 400), r = window.devicePixelRatio || 1;
    sc = W / WW;
    cv.style.width = W + "px"; cv.style.height = Math.round(WH * sc) + "px"; $("#fBoard").style.width = W + "px";
    cv.width = Math.round(W * r); cv.height = Math.round(WH * sc * r);
    ctx.setTransform(sc * r, 0, 0, sc * r, 0, 0);
    draw();
  }
  onPress(cv, flap);
  document.addEventListener("keydown", function (e) { if (e.keyCode === 32 || e.keyCode === 38 || e.keyCode === 87) { e.preventDefault(); flap(); } }, false);
  $("#fMode").onclick = function (e) {
    var b = closest(e.target, "button"); if (!b || state === "run") { return; }
    mode = parseInt(b.getAttribute("data-m"), 10); store.set("flap.mode", mode); reset(); draw();
  };
  window.onresize = size;
  reset(); size(); idle();
})();
</script>
</body>
</html>
