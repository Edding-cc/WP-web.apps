<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1F3A5F">
<title>Stoppuhr · Windows Phone 8.1 Web Apps</title>
<link rel="stylesheet" href="../../assets/style.css">
<script>var ROOT="../../";</script>
<script src="../../assets/common.js"></script>
</head>
<body>
<header class="top"><div class="wrap"><a class="iconbtn" href="../../" aria-label="Zurück"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></a><h1>Stoppuhr</h1><a class="iconbtn" href="../../einstellungen/" aria-label="Einstellungen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h8M18 6h2M4 12h2M12 12h8M4 18h10M20 18h0"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/></svg></a></div></header>
<main class="wrap">
<div class="card"><div class="timebig" id="swT">00:00,0</div><div class="center muted" id="swLap">&nbsp;</div></div>
<div class="ctl"><button id="swReset" class="tonal">Löschen</button><button id="swGo" class="ac">Start</button><button id="swLapBtn" class="tonal">Runde</button></div>
<div class="card" id="swList"></div>
<button class="btn text" id="swCopy">Runden kopieren</button>
</main>
<div id="fpsOverlay"></div>
<div class="toast" id="toast" role="status"><span></span></div>
<script>
(function () {
  "use strict";
  /* Zeit läuft über Zeitstempel weiter, auch wenn die Seite im Hintergrund war */
  var s = assign({ run: false, start: 0, acc: 0, laps: [] }, store.get("sw", {})), iv = 0;
  function now() { return s.acc + (s.run ? Date.now() - s.start : 0); }
  function fmt(ms) { return fmtDur(ms, true) + Math.floor(ms % 100 / 10); }
  function save() { store.set("sw", s); }
  function tick() {
    var t = now(), last = s.laps.length ? s.laps[s.laps.length - 1] : 0;
    $("#swT").textContent = fmt(t);
    $("#swLap").textContent = s.laps.length ? "Runde " + (s.laps.length + 1) + ": " + fmt(t - last) : " ";
  }
  function ui() {
    $("#swGo").textContent = s.run ? "Stopp" : now() ? "Weiter" : "Start";
    $("#swLapBtn").disabled = !s.run;
    clearInterval(iv); if (s.run) { iv = setInterval(tick, 47); }
    tick(); laps();
  }
  function laps() {
    var h = "", i, d = [], mn = Infinity, mx = -1, prev = 0;
    for (i = 0; i < s.laps.length; i++) { d.push(s.laps[i] - prev); prev = s.laps[i]; mn = Math.min(mn, d[i]); mx = Math.max(mx, d[i]); }
    for (i = s.laps.length - 1; i >= 0; i--) {
      var cls = s.laps.length > 2 ? (d[i] === mn ? " ok" : d[i] === mx ? " err" : "") : "";
      h += '<tr><td>Runde ' + (i + 1) + '</td><td class="mono' + cls + '">' + fmt(d[i]) + '</td><td class="mono muted" style="text-align:right">' + fmt(s.laps[i]) + "</td></tr>";
    }
    $("#swList").innerHTML = h ? '<table class="tbl"><tr><th>Runde</th><th>Zeit</th><th style="text-align:right">Gesamt</th></tr>' + h + "</table>" : '<p class="muted" style="margin:0">Noch keine Runden.</p>';
  }
  onPress($("#swGo"), function () {
    if (s.run) { s.acc = now(); s.run = false; } else { s.start = Date.now(); s.run = true; }
    save(); ui();
  });
  onPress($("#swLapBtn"), function () { if (s.run) { s.laps.push(now()); save(); laps(); } });
  $("#swReset").onclick = function () { s = { run: false, start: 0, acc: 0, laps: [] }; save(); ui(); };
  $("#swCopy").onclick = function () {
    if (!s.laps.length) { toast("Keine Runden"); return; }
    var out = [], prev = 0;
    for (var i = 0; i < s.laps.length; i++) { out.push("Runde " + (i + 1) + "\t" + fmt(s.laps[i] - prev) + "\t" + fmt(s.laps[i])); prev = s.laps[i]; }
    copy(out.join("\n"));
  };
  ui();
})();
</script>
</body>
</html>
