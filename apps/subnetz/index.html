<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1F3A5F">
<title>Subnetzrechner · Windows Phone 8.1 Web Apps</title>
<link rel="stylesheet" href="../../assets/style.css">
<style>
.bin { font-family: Consolas, "Courier New", monospace; font-size: 13px; word-break: break-all; line-height: 1.6; }
.bin .n { font-weight: 700; }
</style>
<script>var ROOT="../../";</script>
<script src="../../assets/common.js"></script>
</head>
<body>
<header class="top"><div class="wrap"><a class="iconbtn" href="../../" aria-label="Zurück"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></a><h1>Subnetzrechner</h1><a class="iconbtn" href="../../einstellungen/" aria-label="Einstellungen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h8M18 6h2M4 12h2M12 12h8M4 18h10M20 18h0"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/></svg></a></div></header>
<main class="wrap">
<div class="card">
<label class="fld" for="snIp">IPv4-Adresse (auch mit /Präfix)</label><input type="text" id="snIp" class="mono" placeholder="192.168.1.10/24" autocomplete="off" autocapitalize="off">
<label class="fld" for="snMask">Netzmaske oder Präfix</label><input type="text" id="snMask" class="mono" placeholder="255.255.255.0 oder 24" autocomplete="off">
<label class="fld" for="snPre">Präfix: /<b id="snPreV">24</b></label><input type="range" id="snPre" min="0" max="32" value="24">
</div>
<div class="card"><div id="snOut"></div><div class="bin mt" id="snBin"></div><button class="btn tonal mt" id="snCopy">Ergebnis kopieren</button></div>
<div class="card">
<h3>In Subnetze aufteilen</h3>
<label class="fld" for="snSplit">Neues Präfix</label><select id="snSplit"></select>
<div id="snList" class="mt" style="max-height:360px;overflow:auto"></div>
</div>
<div class="card"><h3>Präfix-Tabelle</h3><button class="btn tonal" id="snTblBtn">Anzeigen</button><div id="snTbl" class="mt" hidden></div></div>
</main>
<div id="fpsOverlay"></div>
<div class="toast" id="toast" role="status"><span></span></div>
<script>
(function () {
  "use strict";
  function ipToInt(s) {
    var p = String(s).replace(/^\s+|\s+$/g, "").split(".");
    if (p.length !== 4) { return null; }
    var n = 0;
    for (var i = 0; i < 4; i++) {
      if (!/^\d{1,3}$/.test(p[i]) || +p[i] > 255) { return null; }
      n = n * 256 + (+p[i]);
    }
    return n;
  }
  function intToIp(n) { return [n >>> 24, (n >>> 16) & 255, (n >>> 8) & 255, n & 255].join("."); }
  function maskOf(p) { return p === 0 ? 0 : (0xFFFFFFFF << (32 - p)) >>> 0; }
  function prefixOfMask(m) {
    var n = ipToInt(m); if (n == null) { return -1; }
    for (var p = 0; p <= 32; p++) { if (maskOf(p) === n) { return p; } }
    return -1;
  }
  function bin(n) { var s = (n >>> 0).toString(2); while (s.length < 32) { s = "0" + s; } return s; }
  function count(p) { return Math.pow(2, 32 - p); }
  function kind(ip) {
    function inNet(net, p) { return ((ip & maskOf(p)) >>> 0) === ipToInt(net); }
    if (inNet("10.0.0.0", 8) || inNet("172.16.0.0", 12) || inNet("192.168.0.0", 16)) { return "privat (RFC 1918)"; }
    if (inNet("127.0.0.0", 8)) { return "Loopback"; }
    if (inNet("169.254.0.0", 16)) { return "Link-Local (APIPA)"; }
    if (inNet("100.64.0.0", 10)) { return "Carrier-Grade NAT (RFC 6598)"; }
    if (inNet("192.0.2.0", 24) || inNet("198.51.100.0", 24) || inNet("203.0.113.0", 24)) { return "Dokumentation (RFC 5737)"; }
    if (inNet("224.0.0.0", 4)) { return "Multicast"; }
    if (ip === 0xFFFFFFFF) { return "Broadcast"; }
    if (inNet("240.0.0.0", 4)) { return "reserviert"; }
    if (inNet("0.0.0.0", 8)) { return "„dieses Netz“ (0.0.0.0/8)"; }
    return "öffentlich";
  }
  function cls(ip) { var o = ip >>> 24; return o < 128 ? "A" : o < 192 ? "B" : o < 224 ? "C" : o < 240 ? "D (Multicast)" : "E"; }
  var cur = null;

  function read(src) {
    var raw = $("#snIp").value, ipStr = raw, p = +$("#snPre").value, m;
    if (raw.indexOf("/") >= 0) {
      ipStr = raw.split("/")[0];
      m = raw.split("/")[1];
      if (/^\d{1,2}$/.test(m) && +m <= 32) { p = +m; }
    }
    if (src === "mask") {
      m = $("#snMask").value.replace(/^[\s\/]+|\s+$/g, "");
      if (/^\d{1,2}$/.test(m) && +m <= 32) { p = +m; } else if (prefixOfMask(m) >= 0) { p = prefixOfMask(m); } else if (m) { $("#snOut").innerHTML = '<p class="err" style="margin:0">Ungültige Netzmaske</p>'; return; }
      if (raw.indexOf("/") >= 0) { $("#snIp").value = ipStr + "/" + p; }
    }
    if (src === "range" && raw.indexOf("/") >= 0) { $("#snIp").value = ipStr + "/" + p; }
    if (src !== "mask") { $("#snMask").value = intToIp(maskOf(p)); }
    $("#snPre").value = p; $("#snPreV").textContent = p;
    var ip = ipToInt(ipStr);
    store.set("subnet", { ip: $("#snIp").value, p: p });
    if (ip == null) { cur = null; $("#snOut").innerHTML = '<p class="muted" style="margin:0">Gültige IPv4-Adresse eingeben, z. B. 10.0.5.20/22</p>'; $("#snBin").innerHTML = ""; $("#snList").innerHTML = ""; return; }
    calc(ip, p);
  }
  function calc(ip, p) {
    var mask = maskOf(p), net = (ip & mask) >>> 0, bc = (net | (~mask >>> 0)) >>> 0, total = count(p), first, last, hosts;
    if (p === 32) { first = last = net; hosts = 1; }
    else if (p === 31) { first = net; last = bc; hosts = 2; }
    else { first = net + 1; last = bc - 1; hosts = total - 2; }
    cur = { ip: ip, p: p, net: net, bc: bc };
    var rows = [
      ["Adresse", intToIp(ip)], ["Netzmaske", intToIp(mask) + " (/" + p + ")"], ["Wildcard", intToIp(~mask >>> 0)],
      ["Netzadresse", intToIp(net) + "/" + p], ["Broadcast", p >= 31 ? "– (keine)" : intToIp(bc)],
      ["Erster Host", intToIp(first)], ["Letzter Host", intToIp(last)],
      ["Nutzbare Hosts", nf(hosts, 0) + (p === 31 ? " (Punkt-zu-Punkt, RFC 3021)" : "")], ["Adressen gesamt", nf(total, 0)],
      ["Klasse (historisch)", cls(ip)], ["Adresstyp", kind(ip)], ["Hex", "0x" + ("0000000" + ip.toString(16).toUpperCase()).slice(-8)]
    ];
    $("#snOut").innerHTML = kv(rows);
    var b = bin(ip), bm = bin(mask), h = "", i;
    function grp(s) { var o = ""; for (i = 0; i < 32; i++) { o += (i < p ? '<span class="n">' + s.charAt(i) + "</span>" : s.charAt(i)) + (i % 8 === 7 && i < 31 ? "." : ""); } return o; }
    h = '<span class="muted">Adresse</span><br>' + grp(b) + '<br><span class="muted">Maske</span><br>' + grp(bm) + '<br><span class="muted">Fett = Netzanteil, normal = Hostanteil</span>';
    $("#snBin").innerHTML = h;
    var sh = "";
    for (i = p; i <= Math.min(32, p + 16); i++) { sh += '<option value="' + i + '">/' + i + " – " + nf(Math.pow(2, i - p), 0) + " Netze à " + nf(count(i), 0) + " Adressen</option>"; }
    var keep = +$("#snSplit").value; $("#snSplit").innerHTML = sh;
    $("#snSplit").value = keep > p && keep <= p + 16 ? keep : Math.min(32, p + 1);
    split();
  }
  function split() {
    if (!cur) { return; }
    var np = +$("#snSplit").value, n = Math.pow(2, np - cur.p), size = count(np), h = "", i, s, max = Math.min(n, 256);
    for (i = 0; i < max; i++) {
      s = cur.net + i * size;
      h += "<tr><td>" + (i + 1) + '</td><td class="mono">' + intToIp(s) + "/" + np + '</td><td class="mono muted">' + (np >= 31 ? intToIp(s) + " – " + intToIp(s + size - 1) : intToIp(s + 1) + " – " + intToIp(s + size - 2)) + "</td></tr>";
    }
    $("#snList").innerHTML = '<table class="tbl"><tr><th>#</th><th>Netz</th><th>Hosts</th></tr>' + h + "</table>" + (n > max ? '<p class="muted" style="font-size:13px">… nur die ersten 256 von ' + nf(n, 0) + " Netzen angezeigt.</p>" : "");
  }
  $("#snIp").oninput = function () { read("ip"); };
  $("#snMask").onchange = function () { read("mask"); };
  $("#snMask").onkeyup = function (e) { if (e.keyCode === 13) { read("mask"); } };
  $("#snPre").oninput = $("#snPre").onchange = function () { read("range"); };
  $("#snSplit").onchange = split;
  $("#snCopy").onclick = function () {
    if (!cur) { return; }
    var t = $$("#snOut dt"), d = $$("#snOut dd"), o = [];
    for (var i = 0; i < t.length; i++) { o.push(t[i].textContent + ": " + d[i].textContent); }
    copy(o.join("\n"));
  };
  $("#snTblBtn").onclick = function () {
    var el = $("#snTbl"), h = "", p;
    if (!el.innerHTML) {
      for (p = 32; p >= 0; p--) { h += '<tr><td class="mono">/' + p + '</td><td class="mono">' + intToIp(maskOf(p)) + '</td><td style="text-align:right">' + nf(p >= 31 ? (p === 32 ? 1 : 2) : count(p) - 2, 0) + "</td></tr>"; }
      el.innerHTML = '<table class="tbl"><tr><th>Präfix</th><th>Maske</th><th style="text-align:right">Hosts</th></tr>' + h + "</table>";
    }
    el.hidden = !el.hidden; this.textContent = el.hidden ? "Anzeigen" : "Ausblenden";
  };
  var sv = store.get("subnet", { ip: "192.168.1.10/24", p: 24 });
  $("#snIp").value = sv.ip; $("#snPre").value = sv.p;
  read("ip");
})();
</script>
</body>
</html>
